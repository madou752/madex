<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MADEX</title>
<link rel="icon" href="/logo.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #04060d; --night: #0a1530; --line: #1a2a4d; --line2: #26406e;
    --blue: #2f7bff; --ice: #9fd8ff; --white: #e8f4ff; --orange: #ff8a3d; --orange2: #ffb27d;
    --text: #dbeaff; --muted: #7f93b5; --core: var(--ice);
    --mono: "JetBrains Mono", Consolas, monospace; --ui: "Rajdhani", "Segoe UI", sans-serif;
    --rs: min(46vh, 500px);
    --accent: #2f7bff; --accent2: #9fd8ff;
    --cutw: polygon(0 0, calc(100% - 14px) 0, 100% 14px, 100% 100%, 14px 100%, 0 calc(100% - 14px));
  }
  body[data-state="listening"], body[data-state="followup"], body[data-state="enroll"] { --core: var(--white); }
  body[data-state="offline"], body.mic-off { --core: var(--orange); }
  body.mentor { --accent: #ffb547; --accent2: #ffe2a8; --core: #ffcf7a; }
  @property --ang { syntax: '<angle>'; inherits: false; initial-value: 0deg; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: radial-gradient(ellipse at 50% 42%, var(--night) 0%, var(--bg) 62%) fixed, var(--bg);
    color: var(--text); font-family: var(--ui); font-size: 16px;
    display: flex; flex-direction: column; overflow: hidden;
  }
  .cut { clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }

  header { display: flex; align-items: center; gap: 14px; padding: 12px 20px; flex-shrink: 0; z-index: 2; }
  .logo { font-family: "Orbitron", sans-serif; font-weight: 900; font-size: 18px; letter-spacing: .32em; color: var(--white); position: relative; }
  .logo::before, .logo::after { content: "MADEX"; position: absolute; inset: 0; opacity: .7; }
  .logo::before { color: var(--blue); animation: glitch 3.2s infinite steps(1); clip-path: inset(0 0 60% 0); }
  .logo::after { color: var(--ice); animation: glitch 2.7s infinite reverse steps(1); clip-path: inset(55% 0 0 0); }
  @keyframes glitch { 0%,92%,100% { transform: none; } 93% { transform: translate(-3px, 1px); } 95% { transform: translate(3px,-1px); } 97% { transform: translate(-1px, 0); } }
  .spacer { flex: 1; }
  .chip { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .06em; white-space: nowrap; }
  .chip b { color: var(--ice); font-weight: 600; }
  #ctx { max-width: 38vw; overflow: hidden; text-overflow: ellipsis; }
  #clock { font-family: "Orbitron", sans-serif; font-size: 16px; letter-spacing: .2em; color: var(--white); }

  main { flex: 1; min-height: 0; position: relative; }
  #center { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: safe center; gap: 8px; overflow: hidden; padding: 0 20px 6px; }
  #wave { width: var(--rs); height: var(--rs); display: block; animation: float 7s ease-in-out infinite; flex-shrink: 0; }
  @keyframes float { 50% { transform: translateY(-6px); } }
  #status { font-family: "Orbitron", sans-serif; font-weight: 700; font-size: 14px; letter-spacing: .35em; color: var(--core); text-shadow: 0 0 12px var(--core); text-align: center; }
  body.asking #status { color: var(--orange); text-shadow: 0 0 12px var(--orange); }
  #activity { font-family: var(--mono); font-size: 12px; color: var(--muted); min-height: 16px; text-align: center; max-width: 660px; }
  #warning { max-width: 640px; padding: 8px 10px; border: 1px solid var(--orange); color: var(--orange2); font-size: 14px; display: none; }

  #subs { width: 100%; max-width: 660px; text-align: center; display: flex; flex-direction: column; gap: 4px; min-height: 52px; cursor: pointer; }
  #subs .u { font-size: 17px; color: var(--white); opacity: .72; }
  #subs .m { font-size: 19px; font-weight: 600; color: var(--ice); }
  #subs div { animation: in .35s ease-out; transition: opacity 1.2s; }
  #subs.faded div { opacity: .25; }
  @keyframes in { from { opacity: 0; transform: translateY(5px); } }

  #quick { width: 100%; max-width: 660px; border: 1px solid var(--orange); background: rgba(255,138,61,.06); padding: 12px 14px; display: none; animation: in .3s ease-out; }
  #quick.on { display: block; }
  #quick .top { display: flex; gap: 10px; justify-content: space-between; align-items: baseline; flex-wrap: wrap; }
  #quick .lab { font-family: var(--mono); font-size: 11px; letter-spacing: .15em; color: var(--orange); }
  kbd { font-family: var(--mono); font-size: 11px; color: var(--muted); margin-left: 6px; }

  form.cmd { width: 100%; max-width: 660px; display: flex; gap: 8px; }
  input, textarea { flex: 1; min-width: 0; min-height: 42px; background: rgba(4,6,13,.7); border: 1px solid var(--line2); color: var(--white);
    font: inherit; padding: 8px 12px; outline: none; }
  input:focus, textarea:focus { border-color: var(--blue); box-shadow: 0 0 0 2px rgba(47,123,255,.25); }
  input[type=range] { padding: 0; min-height: 28px; accent-color: var(--blue); }
  button { font-family: var(--ui); font-weight: 700; font-size: 14px; letter-spacing: .1em; min-height: 42px; padding: 0 14px; cursor: pointer;
    background: transparent; color: var(--white); border: 1px solid var(--line2); }
  button:hover { background: rgba(47,123,255,.12); }
  button:focus-visible { outline: 2px solid var(--ice); outline-offset: 2px; }
  button.ok { border-color: var(--blue); background: rgba(47,123,255,.14); } button.ok:hover { background: rgba(47,123,255,.26); }
  button.no { color: var(--orange); border-color: var(--orange); } button.no:hover { background: rgba(255,138,61,.12); }
  button.ghost { color: var(--muted); }
  button.sm { min-height: 34px; font-size: 12px; padding: 0 10px; }
  button:disabled { opacity: .4; cursor: default; }

  /* ---------- dock ---------- */
  nav#dock { flex-shrink: 0; display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 8px; padding: 10px 20px 16px; z-index: 2; }
  #dock .d { min-height: 46px; padding: 0 11px; font-size: 13px; letter-spacing: .07em; background: rgba(10,21,48,.5); border-color: var(--line); display: flex; align-items: center; gap: 7px; }
  #dock .d[aria-pressed="true"] { border-color: var(--blue); background: rgba(47,123,255,.16); }
  #dock svg, .wt svg { width: 18px; height: 18px; fill: none; stroke: var(--ice); stroke-width: 2; flex-shrink: 0; }
  .n { display: inline-block; min-width: 18px; padding: 1px 6px; background: var(--orange); color: var(--bg); font-size: 12px; text-align: center; }
  .n.soft { background: var(--blue); color: var(--white); }
  .n:empty { display: none; }
  #talkwrap { display: inline-flex; margin: 0 6px; --glow: 6px; --ga: .35; filter: drop-shadow(0 0 var(--glow) rgba(47,123,255,var(--ga))); transition: filter .3s; }
  body.mentor #talkwrap { filter: drop-shadow(0 0 var(--glow) rgba(255,181,71,var(--ga))); }
  #talkwrap:hover { --glow: 12px; --ga: .6; }
  #talk { --oct: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
    width: 58px; height: 58px; padding: 1.5px; border: 0; clip-path: var(--oct);
    background: linear-gradient(135deg, var(--accent), var(--accent2) 50%, var(--accent)); display: block; }
  #talk .core { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; clip-path: var(--oct);
    background: radial-gradient(circle at 50% 40%, #12306a, #0a1530 70%); transition: background .3s; }
  #talk:hover .core { background: radial-gradient(circle at 50% 40%, #1a428f, #0d1d44 70%); }
  #talk svg { width: 22px; height: 22px; stroke: var(--white); fill: none; stroke-width: 2; }
  #talk .off { display: none; }
  body.mic-off #talk { background: linear-gradient(135deg, #b85a24, var(--orange)); }
  body.mic-off #talkwrap { filter: drop-shadow(0 0 6px rgba(255,138,61,.4)); }
  body.mic-off #talk .on { display: none; } body.mic-off #talk .off { display: block; stroke: var(--orange); }
  body[data-state="listening"] #talk { background: linear-gradient(135deg, #fff, var(--ice)); }
  body[data-state="listening"] #talkwrap { animation: talkpulse 1.1s ease-in-out infinite; --glow: 16px; --ga: .7; }
  body[data-state="followup"] #talkwrap { --glow: 10px; --ga: .5; }
  @keyframes talkpulse { 50% { filter: brightness(1.3); } }
  @media (max-width: 1220px) { #dock .d .lbl { display: none; } #dock .d { padding: 0 14px; } }

  /* ---------- fenêtres façon OS ---------- */
  #desk { position: absolute; inset: 0; pointer-events: none; }
  .win { position: absolute; pointer-events: auto; min-width: 300px; min-height: 160px; width: 420px; height: 440px;
    --glow: 5px; --ga: .22; filter: drop-shadow(0 0 var(--glow) rgba(47,123,255,var(--ga))) drop-shadow(0 16px 26px rgba(0,0,0,.55));
    transition: filter .35s ease; animation: winin .22s ease-out; }
  body.mentor .win { filter: drop-shadow(0 0 var(--glow) rgba(255,181,71,var(--ga))) drop-shadow(0 16px 26px rgba(0,0,0,.55)); }
  .win:hover { --glow: 9px; --ga: .38; }
  .win.focus { --glow: 15px; --ga: .6; }
  .win .frame { position: absolute; inset: 0; padding: 1px; clip-path: var(--cutw);
    background: linear-gradient(var(--line2), var(--line2)); transition: background .3s; }
  .win.focus .frame, .win:hover .frame { background: linear-gradient(135deg, var(--accent), var(--accent2) 50%, var(--accent)); }
  .win.opening .frame { background: conic-gradient(from var(--ang), transparent 0deg, transparent 250deg, var(--accent2) 300deg, #fff 320deg, var(--accent) 340deg, transparent 360deg),
    linear-gradient(var(--line2), var(--line2)); animation: sweep .9s ease-out forwards; }
  @keyframes sweep { to { --ang: 360deg; } }
  @keyframes winin { from { opacity: 0; transform: scale(.96) translateY(8px); } }
  .win .inner { width: 100%; height: 100%; display: flex; flex-direction: column; clip-path: var(--cutw);
    background: rgba(8,16,38,.95); }
  .win .rz { position: absolute; right: 0; bottom: 0; width: 22px; height: 22px; cursor: nwse-resize; z-index: 2; }
  .win .rz::after { content: ""; position: absolute; right: 5px; bottom: 5px; width: 9px; height: 9px;
    border-right: 2px solid var(--line2); border-bottom: 2px solid var(--line2); }
  .win.focus .rz::after { border-color: var(--accent); }
  .wt { display: flex; align-items: center; gap: 10px; padding: 0 6px 0 14px; height: 42px; border-bottom: 1px solid var(--line); cursor: grab; user-select: none; flex-shrink: 0; }
  .wt:active { cursor: grabbing; }
  .wt h2 { margin: 0; flex: 1; font-family: "Orbitron", sans-serif; font-size: 12px; letter-spacing: .28em; color: var(--white); font-weight: 700; }
  .win.focus .wt h2 { color: var(--accent2); text-shadow: 0 0 10px var(--accent); }
  .wt button { min-height: 32px; width: 34px; padding: 0; border: 0; color: var(--muted); }
  .wb { flex: 1; overflow: auto; padding: 14px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent; }
  /* chat */
  #chat { width: 100%; max-width: 680px; flex: 0 1 auto; min-height: 60px; max-height: 24vh; overflow-y: auto; padding: 6px 4px;
    display: flex; flex-direction: column; gap: 8px; scrollbar-width: thin; scrollbar-color: var(--line2) transparent;
    -webkit-mask-image: linear-gradient(transparent 0, #000 16px); mask-image: linear-gradient(transparent 0, #000 16px); }
  .cm { max-width: 86%; line-height: 1.35; font-size: 17px; padding: 6px 10px; border-left: 2px solid var(--line2); animation: in .3s ease-out; white-space: pre-wrap; }
  .cm.user { align-self: flex-end; border-left: 0; border-right: 2px solid var(--white); color: var(--white); text-align: right; }
  .cm.madex { align-self: flex-start; border-left-color: var(--accent); color: var(--accent2); }
  .cm.partial { opacity: .6; font-style: italic; }
  .cm .who { display: block; font-family: var(--mono); font-size: 10px; letter-spacing: .18em; color: var(--muted); margin-bottom: 2px; font-style: normal; }
  .chatwin { display: flex; flex-direction: column; height: 100%; gap: 10px; }
  .chatwin .list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
  .chatwin form { display: flex; gap: 8px; }
  /* code, mentor, revue, notifs */
  .codeblk { border: 1px solid var(--line2); margin: 8px 0 12px; background: var(--bg); }
  .codeblk .bar { display: flex; justify-content: space-between; align-items: center; padding: 4px 4px 4px 10px; border-bottom: 1px solid var(--line); font-family: var(--mono); font-size: 11px; color: var(--muted); letter-spacing: .1em; }
  .codeblk pre { margin: 0; padding: 10px; overflow: auto; max-height: 360px; font-family: var(--mono); font-size: 12.5px; line-height: 1.5; color: var(--white); }
  .codeblk .mmd { padding: 10px; background: #0b1530; overflow: auto; }
  .issue { border: 1px solid var(--line2); border-left: 3px solid var(--accent); padding: 10px 12px; margin-bottom: 10px; }
  .issue.erreur, .issue.bloquant { border-left-color: var(--orange); }
  .issue.attention, .issue.important { border-left-color: #ffcf5a; }
  .issue h4 { margin: 0 0 4px; font-size: 16px; color: var(--white); }
  .issue .hint { margin-top: 4px; }
  .sev { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; padding: 1px 6px; border: 1px solid currentColor; margin-right: 6px; }
  .verdict { display: inline-block; font-family: "Orbitron", sans-serif; font-size: 11px; letter-spacing: .2em; padding: 3px 8px; border: 1px solid; }
  .verdict.ok { color: var(--ice); } .verdict.a_corriger { color: #ffcf5a; } .verdict.bloquant { color: var(--orange); }
  .nt { border-bottom: 1px solid var(--line); padding: 8px 0; }
  .nt b { color: var(--white); } .nt .app { font-family: var(--mono); font-size: 11px; color: var(--accent2); letter-spacing: .1em; }
  .logbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
  .logbar select, .logbar input { min-height: 32px; font-size: 13px; padding: 4px 8px; flex: 0 1 auto; background: var(--bg); color: var(--white); border: 1px solid var(--line2); }
  .logbar input { flex: 1 1 120px; }
  .logs { font-family: var(--mono); font-size: 11.5px; line-height: 1.5; flex: 1; overflow: auto; background: var(--bg); border: 1px solid var(--line); padding: 6px 8px; white-space: pre-wrap; word-break: break-word; }
  .logs div { border-bottom: 1px solid rgba(26,42,77,.4); }
  .logs .WARNING { color: #ffcf5a; } .logs .ERROR, .logs .CRITICAL { color: var(--orange); }
  .logs .chrono { color: var(--ice); } .logs .tour { color: var(--white); font-weight: 600; margin-top: 4px; }
  .logs .m { color: var(--muted); }
  .logwin { display: flex; flex-direction: column; height: 100%; }
  .steps { margin: 4px 0 0 24px; font-family: var(--mono); font-size: 12px; grid-column: 2 / 4; }
  .steps .ok { color: var(--ice); } .steps .ko { color: var(--orange); }
  body.dropping::after { content: "Déposez le zip de Madex pour l'installer"; position: fixed; inset: 20px; border: 2px dashed var(--accent);
    display: flex; align-items: center; justify-content: center; font-family: "Orbitron", sans-serif; letter-spacing: .2em; color: var(--accent2);
    background: rgba(4,6,13,.8); z-index: 100; }
  #mentorbtn { min-height: 30px; font-family: "Orbitron", sans-serif; font-size: 11px; letter-spacing: .22em; padding: 0 10px; color: var(--muted); border-color: var(--line); }
  body.mentor #mentorbtn { color: #ffcf7a; border-color: #ffb547; background: rgba(255,181,71,.12); box-shadow: 0 0 14px rgba(255,181,71,.35); }
  .res { font-family: var(--mono); font-size: 12px; color: var(--muted); grid-column: 2 / 4; }
  .res.ok { color: var(--ice); } .res.ko { color: var(--orange); }
  .spin { display: inline-block; width: 10px; height: 10px; border: 2px solid var(--line2); border-top-color: var(--accent); border-radius: 50%; animation: rot .8s linear infinite; vertical-align: -1px; margin-right: 6px; }
  @keyframes rot { to { transform: rotate(360deg); } }
  .empty { color: var(--muted); padding: 18px 4px; }
  .wb > .meta { margin: 14px 0 6px; letter-spacing: .12em; }
  .wb > .hint { margin: 6px 0; }
  .wb > h3 { margin: 10px 0 4px; color: var(--white); }

  .card { border: 1px solid var(--line2); background: rgba(4,6,13,.45); padding: 12px 14px; margin-bottom: 12px; animation: in .3s ease-out; }
  .card.pending { border-color: var(--orange); box-shadow: 0 0 18px rgba(255,138,61,.12); }
  .card.done { opacity: .55; }
  .card h3 { margin: 0 0 4px; font-size: 18px; font-weight: 700; color: var(--white); }
  .meta { font-family: var(--mono); font-size: 12px; color: var(--muted); }
  .code { font-family: var(--mono); font-size: 13px; color: var(--orange2); background: var(--bg); border: 1px solid var(--line); padding: 7px 9px;
    margin: 8px 0; white-space: pre-wrap; word-break: break-all; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  .files { font-family: var(--mono); font-size: 12.5px; margin: 8px 0; }
  .files span { display: inline-block; min-width: 72px; color: var(--muted); }
  details summary { cursor: pointer; color: var(--ice); font-family: var(--mono); font-size: 12px; margin-top: 6px; }
  pre.diff { font-family: var(--mono); font-size: 12px; line-height: 1.45; background: var(--bg); border: 1px solid var(--line); padding: 10px;
    max-height: 340px; overflow: auto; margin: 6px 0 0; color: var(--muted); }
  pre.diff .a { color: var(--ice); } pre.diff .d { color: var(--orange); } pre.diff .h { color: var(--blue); }
  .hint { font-size: 13px; color: var(--muted); } .hint.bad { color: var(--orange2); }
  .task { border-color: var(--line); }
  .task[data-s="running"] { border-color: var(--blue); } .task[data-s="question"], .task[data-s="error"] { border-color: var(--orange); } .task[data-s="stopped"] { opacity: .6; }
  .act { font-family: var(--mono); font-size: 12px; color: var(--ice); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .task[data-s="running"] .act::before { content: "▸ "; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  table.rules { width: 100%; border-collapse: collapse; }
  table.rules td { padding: 9px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  .seg { display: inline-flex; border: 1px solid var(--line2); }
  .seg button { border: 0; color: var(--muted); padding: 0 9px; min-height: 36px; font-size: 13px; }
  .seg button[aria-pressed="true"] { background: rgba(47,123,255,.2); color: var(--white); }
  .seg button[aria-pressed="true"].autorise { background: rgba(159,216,255,.16); color: var(--ice); }
  .seg button[aria-pressed="true"].interdit { background: rgba(255,138,61,.16); color: var(--orange); }
  .lock { font-family: var(--mono); font-size: 12px; color: var(--orange); }
  .conn h3 { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .badge { font-family: var(--mono); font-size: 11px; padding: 2px 8px; border: 1px solid; font-weight: 400; }
  .badge.on { color: var(--ice); border-color: var(--ice); } .badge.off { color: var(--orange); border-color: var(--orange); }
  .conn ol { margin: 6px 0 10px 18px; padding: 0; color: var(--muted); font-size: 15px; line-height: 1.45; }
  .conn ol b { color: var(--text); font-weight: 600; } .conn code { font-family: var(--mono); font-size: 12.5px; color: var(--ice); }
  .err { color: var(--orange2); font-size: 14px; margin-top: 6px; }
  .voices { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 8px; margin-top: 10px; }
  .voice { border: 1px solid var(--line2); padding: 8px 10px; }
  .voice.cur { border-color: var(--blue); }
  #log .msg { margin: 10px 0; line-height: 1.35; font-size: 16px; }
  #log .who { display: block; font-family: var(--mono); font-size: 11px; letter-spacing: .15em; margin-bottom: 2px; }
  #log .user .who { color: var(--white); } #log .madex .who { color: var(--blue); }
  a { color: var(--ice); }
  .tabs { display: flex; gap: 4px; margin: -4px 0 12px; }
  .tabs button { min-height: 34px; font-size: 12px; color: var(--muted); border-color: var(--line); }
  .tabs button[aria-selected="true"] { color: var(--white); border-color: var(--blue); background: rgba(47,123,255,.14); }

  /* jauges */
  .gauge { margin: 10px 0 14px; }
  .gauge .lab { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 5px; }
  .gauge .lab b { font-family: var(--mono); color: var(--white); }
  .bar { height: 10px; background: var(--line); position: relative; overflow: hidden; }
  .bar i { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--blue), var(--ice)); transition: width .5s; }
  .bar.warn i { background: linear-gradient(90deg, #d86a2a, var(--orange)); }
  .kpis { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; margin: 6px 0 14px; }
  .kpi { border: 1px solid var(--line); padding: 8px 10px; }
  .kpi b { display: block; font-family: "Orbitron", sans-serif; font-size: 18px; color: var(--white); letter-spacing: .05em; }
  .kpi span { font-size: 13px; color: var(--muted); }
  .days { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; align-items: end; height: 110px; margin-top: 8px; }

<script>
const TOKEN = "__MADEX_TOKEN__";
const $ = id => document.getElementById(id);

const LABELS = { idle: 'EN VEILLE', listening: "À L'ÉCOUTE", followup: 'JE VOUS ÉCOUTE…', transcribing: 'ANALYSE', thinking: 'RÉFLEXION',
  speaking: 'MADEX PARLE', offline: 'HORS LIGNE', mic_off: 'MICRO COUPÉ', enroll: 'LISEZ LA PHRASE' };
const CONV = /^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\([\w\-./ ]+\))?!?: \S.{0,99}$/;
let state = 'offline', micOn = true;
const S = { tasks: new Map(), approvals: new Map(), rules: [], mailAt: 0, msgs: [], partial: '', streaming: false,

  logs: [], logSince: 0, spotifySteps: null, chromeSteps: null };

function post(path, data) {

}

/* ---------- conversation : bloc fixe sous le réacteur + fenêtre CHAT ---------- */

}

    const key = m.who + '|' + (m.partial ? 'p' : '') + '|' + m.text;
    const node = list.children[i];
    if (!node) { const n = msgEl(m); n.dataset.k = key; list.append(n); }

}
let chatQueued = false;

  if (chatQueued) return; chatQueued = true;
  requestAnimationFrame(() => {
    chatQueued = false;
    const c = $('chat'), stick = c.scrollHeight - c.scrollTop - c.clientHeight < 40;   // on reste en bas, sauf si Madou remonte lire
    fillChat(c, stick);
    const b = winBody('hx'); const l = b && b.querySelector('.list');

}

function addMsg(who, text) { if (who === 'user') S.partial = ''; S.streaming = false; pushMsg(who, text); }
function streamPart(text) {
  const last = S.msgs[S.msgs.length - 1];

  renderChat();
}
function streamDone(text) { const last = S.msgs[S.msgs.length - 1]; if (S.streaming && last) last.text = text; else pushMsg('madex', text); S.streaming = false; renderChat(); }
function ago(ts) { const m = Math.floor((Date.now() / 1000 - ts) / 60); return m < 1 ? "à l'instant" : m < 60 ? `il y a ${m} min` : `il y a ${Math.floor(m / 60)} h`; }

/* ---------- gestionnaire de fenêtres ---------- */
const WINS = {
  hx: { title: 'CHAT', w: 440, h: 520, render: b => renderChatWin(b) },
  ap: { title: 'À VALIDER', w: 480, h: 520, render: b => renderApprovals(b) },
  ss: { title: 'SESSIONS', w: 460, h: 480, render: b => renderTasks(b) },
  us: { title: 'CONSOMMATION', w: 440, h: 500, render: b => renderUsage(b), every: 60000 },
  mu: { title: 'MUSIQUE', w: 400, h: 230, render: b => renderMusic(b), every: 5000 },
  sy: { title: 'SYSTÈME', w: 380, h: 340, render: b => renderSystem(b), every: 3000 },
  rg: { title: 'RÉGLAGES', w: 520, h: 560, render: b => renderSettings(b) },
  dg: { title: 'DIAGNOSTIC', w: 500, h: 600, render: b => renderDiag(b) },
  mt: { title: 'MENTOR', w: 520, h: 600, render: b => renderMentor(b) },
  cd: { title: 'CODE', w: 520, h: 480, render: b => renderCode(b) },
  rv: { title: 'REVUE DE PR', w: 560, h: 620, render: b => renderReview(b) },
  nt: { title: 'NOTIFICATIONS', w: 440, h: 480, render: b => renderNotifs(b) },
  lg: { title: 'JOURNAL', w: 640, h: 540, render: b => renderLogs(b) },
};
const open = new Map(); let zTop = 10;
function winBody(id) { const w = open.get(id); return w && w.querySelector('.wb'); }
function renderChatWin(b) {
  if (!b.querySelector('.chatwin')) {
    const wrap = el('div', 'chatwin'), list = el('div', 'list'), f = el('form'), i = el('input');
    i.placeholder = 'Écrivez à Madex…'; i.setAttribute('aria-label', 'Écrire à Madex'); i.autocomplete = 'off';
    f.append(i, el('button', 'ok sm', 'ENVOYER'));
    f.onsubmit = e => { e.preventDefault(); const t = i.value.trim(); if (!t) return; i.value = ''; post('/ask', { text: t }); };
    wrap.append(list, f); b.replaceChildren(wrap); b.style.padding = '12px 14px';

}
function focusWin(w) { document.querySelectorAll('.win').forEach(x => x.classList.remove('focus')); w.classList.add('focus'); w.style.zIndex = ++zTop; }

  const pos = store.get('win.' + id, null);
  const desk = $('desk'), R = desk.getBoundingClientRect();
  const n = open.size;
  // emplacements par défaut : de part et d'autre du réacteur, sans le cacher
  const side = Math.max(320, (R.width - Math.min(R.height * .54, 560)) / 2 - 24);
  const slots = [[R.width - side - 12, 8], [12, 8], [R.width - side - 12, R.height / 2 + 4], [12, R.height / 2 + 4]];
  const used = [...open.values()].map(x => x._slot);
  const slot = [0, 1, 2, 3].find(i => !used.includes(i)) ?? 0;
  const w = el('section', 'win opening'); w.setAttribute('role', 'dialog'); w.setAttribute('aria-label', def.title);
  setTimeout(() => w.classList.remove('opening'), 950);
  const wd = Math.min(pos?.w || Math.min(def.w, side), R.width - 20), ht = Math.min(pos?.h || def.h, R.height - 10);
  w.style.width = wd + 'px'; w.style.height = ht + 'px';
  w._slot = slot;
  w.style.left = Math.max(0, Math.min(pos?.x ?? slots[slot][0] + (slot % 2 ? 0 : side - wd), R.width - 120)) + 'px';
  w.style.top = Math.max(0, Math.min(pos?.y ?? slots[slot][1], R.height - 60)) + 'px';
  const bar = el('div', 'wt'); const h = el('h2', '', def.title);
  const x = el('button', '', ''); x.type = 'button'; x.setAttribute('aria-label', 'Fermer ' + def.title);
  x.innerHTML = '<svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3 3 L13 13 M13 3 L3 13" stroke="currentColor" stroke-width="1.8"/></svg>';
  x.onclick = () => closeWin(id);
  bar.append(h, x);
  const body = el('div', 'wb');
  const frameEl = el('div', 'frame'), inner = el('div', 'inner'), rz = el('div', 'rz');

function savePos(id) { const w = open.get(id); if (w) store.set('win.' + id, { x: w.offsetLeft, y: w.offsetTop, w: w.offsetWidth, h: w.offsetHeight }); }

function closeAll() { [...open.keys()].forEach(closeWin); }
function topWin() { let best = null; open.forEach((w, id) => { if (!best || +w.style.zIndex > +open.get(best).style.zIndex) best = id; }); return best; }
document.querySelectorAll('#dock .d').forEach(b => b.onclick = () => open.has(b.dataset.w) ? closeWin(b.dataset.w) : openWin(b.dataset.w));


/* ---------- accords ---------- */
function diffPre(text) {
  const pre = el('pre', 'diff');
  for (const line of text.split('\n')) {
    const cls = line.startsWith('+') && !line.startsWith('+++') ? 'a' : line.startsWith('-') && !line.startsWith('---') ? 'd' : line.startsWith('@@') || line.startsWith('diff ') ? 'h' : '';
    pre.append(el('span', cls, line + '\n'));
  }
  return pre;
}
const sendDecision = (a, decision, note) => post(`/api/approvals/${a.id}`, { decision, note: note || '' });
function toolButtons(a, row, keys) {
  const b = (t, v, cls, k) => { const x = el('button', cls, t); if (keys) x.append(el('kbd', '', k)); x.onclick = () => sendDecision(a, v); row.append(x); };
  b('UNE FOIS', 'une_fois', 'ok', 'O'); b('POUR LA SESSION', 'session', '', 'S'); b('TOUJOURS', 'toujours', '', 'T'); b('REFUSER', 'refuser', 'no', 'R');
}
function approvalCard(a) {
  const c = el('div', 'card ' + (a.status === 'pending' ? 'pending' : 'done'));
  c.append(el('h3', '', a.title));
  const d = a.detail || {};
  if (a.kind === 'tool') c.append(el('div', 'code', d.action || ''));
  else if (a.kind === 'commit') {
    c.append(el('div', 'meta', `${d.files.length} fichier(s) · branche ${d.branch}`));
    const files = el('div', 'files');
    d.files.slice(0, 30).forEach(f => { const r = el('div'); r.append(el('span', '', f.kind), document.createTextNode(f.file)); files.append(r); });
    c.append(files);
    const det = el('details'); det.append(el('summary', '', 'Voir le diff' + (d.truncated ? ' (tronqué)' : '')), diffPre(d.diff || '(aucun diff)'));
    c.append(det);
  } else if (a.kind === 'push') c.append(el('div', 'meta', `branche ${d.branch} → origin`));
  if (a.status !== 'pending') {
    const lab = { une_fois: 'autorisé une fois', session: 'autorisé pour la session', toujours: 'autorisé pour toujours', refuser: 'refusé', valider: 'validé' }[a.decision] || a.decision;
    c.append(el('div', 'meta', (a.status === 'expired' ? 'expiré — ' : '') + lab)); return c;
  }
  const row = el('div', 'row');
  if (a.kind === 'tool') toolButtons(a, row, false);
  else if (a.kind === 'commit') {
    const msg = el('input'); msg.value = d.message || ''; msg.placeholder = 'feat(scope): describe the change'; msg.setAttribute('aria-label', 'Message de commit');
    const hint = el('div', 'hint');
    const check = () => { const ok = CONV.test(msg.value.trim()); hint.textContent = ok ? 'Conventional Commits ✓' : 'Format attendu : type(scope): message en anglais'; hint.className = 'hint' + (ok ? '' : ' bad'); return ok; };
    msg.oninput = check; check();
    const v = el('button', 'ok', 'VALIDER LE COMMIT'); v.onclick = () => { if (check()) sendDecision(a, 'valider', msg.value.trim()); else toast('Message non conforme'); };
    const n = el('button', 'no', 'REFUSER'); n.onclick = () => sendDecision(a, 'refuser');
    msg.style.width = '100%'; const wrap = el('div'); wrap.style.cssText = 'width:100%;margin-top:10px'; wrap.append(msg, hint);
    c.append(wrap); row.append(v, n);
  } else {
    const v = el('button', 'ok', 'VALIDER'); v.onclick = () => sendDecision(a, 'valider');
    const n = el('button', 'no', 'REFUSER'); n.onclick = () => sendDecision(a, 'refuser'); row.append(v, n);

}
const pendingList = () => [...S.approvals.values()].filter(a => a.status === 'pending').sort((x, y) => x.created - y.created);
function renderQuick() {
  const q = $('quick'), a = pendingList()[0];
  document.body.classList.toggle('asking', !!a); updateStatus();
  if (!a || open.has('ap')) { q.classList.remove('on'); q._id = null; return; }
  if (q._id === a.id) { q.classList.add('on'); return; }
  q._id = a.id;
  const top = el('div', 'top'); top.append(el('b', '', a.title), el('span', 'lab', a.kind === 'tool' ? 'VOTRE ACCORD' : a.kind.toUpperCase()));
  const row = el('div', 'row'); const parts = [top];
  if (a.kind === 'tool') { parts.push(el('div', 'code', (a.detail || {}).action || '')); toolButtons(a, row, true); }
  else { const v = el('button', 'ok', a.kind === 'commit' ? 'VOIR LE DIFF ET VALIDER' : 'VOIR'); v.onclick = () => openWin('ap'); row.append(v); }
  parts.push(row); q.replaceChildren(...parts); q.classList.add('on');
}
function renderApprovals(box) {
  const all = [...S.approvals.values()], pend = pendingList();
  $('nap').textContent = pend.length || '';
  renderQuick();
  box = box || winBody('ap'); if (!box) return;
  if (box.contains(document.activeElement) && document.activeElement.tagName === 'INPUT') return;
  const list = [...pend, ...all.filter(a => a.status !== 'pending').sort((x, y) => y.created - x.created)];
  if (!list.length) { box.replaceChildren(el('div', 'empty', 'Rien à valider. Madex vous demandera votre accord ici et à voix haute.')); return; }
  box.replaceChildren(...list.slice(0, 25).map(approvalCard));
}
document.addEventListener('keydown', e => {

/* ---------- mise à jour depuis un fichier (bouton ou glisser-déposer) ---------- */
async function uploadUpdate(file) {
  if (!file || !/\.zip$/i.test(file.name)) { toast('Choisissez le zip de Madex (madex-phaseX.Y.zip)'); return; }
  const buf = new Uint8Array(await file.arrayBuffer()); let bin = '';
  for (let i = 0; i < buf.length; i += 0x8000) bin += String.fromCharCode.apply(null, buf.subarray(i, i + 0x8000));
  const r = await post('/api/update/upload', { name: file.name, content: btoa(bin) });
  if (r.ok) toast('Installation lancée : Madex va redémarrer');
}
function pickUpdate() { const i = document.createElement('input'); i.type = 'file'; i.accept = '.zip'; i.onchange = () => uploadUpdate(i.files[0]); i.click(); }

    } else if (m.kind === 'state') setState(m.value);

    else if (m.kind === 'mentor_review') { setMentor({ review: m.review, frequent: m.frequent, status: '' }); openWin('mt'); }

    else if (m.kind === 'review') { S.review = m.review; openWin('rv'); refreshWin('rv'); }
    else if (m.kind === 'notifs') { S.notifs = m.items || []; refreshWin('nt'); }
    else if (m.kind === 'vocab') refreshWin('dg');
    else if (m.kind === 'log') addLog(m.entry);
    else if (m.kind === 'spotify_test') { S.spotifySteps = m.steps; refreshWin('dg'); }
    else if (m.kind === 'chrome_test') { S.chromeSteps = m.steps; refreshWin('dg'); }
    else if (m.kind === 'activity') $('activity').textContent = '› ' + m.text + '…';
    else if (m.kind === 'heard') showHeard(m.text);
    else if (m.kind === 'task') { S.tasks.set(m.task.id, m.task); renderTasks(); }
    else if (m.kind === 'approval') { const isNew = !S.approvals.has(m.approval.id); S.approvals.set(m.approval.id, m.approval); renderApprovals();
      if (isNew && m.approval.status === 'pending' && m.approval.kind === 'commit') openWin('ap'); }
    else if (m.kind === 'rules') { S.rules = m.rules; renderSettings(); }
    else if (m.kind === 'toast') toast(m.text);
    else if (m.kind === 'level') { LV[m.who] = m.v; LV.at = performance.now(); if (m.v > .02) { LV.who = m.who; LV.b = m.b; } }
    else if (m.kind === 'voice') showVoice(m.usage);
    else if (m.kind === 'mails') S.mailAt = performance.now();
    else if (m.kind === 'mic') setMic(!!m.on);
    else if (m.kind === 'context') showContext(m.context);
    else if (m.kind === 'music') refreshWin('mu');
    else if (m.kind === 'panel') { if (m.pane && WINS[m.pane]) openWin(m.pane); else closeAll(); }
    else if (m.kind === 'voice_status' || m.kind === 'connections') loadConnections();
  };
  es.onerror = () => setState('offline');
}

  ctx.lineCap = 'round';

  ctx.shadowBlur = 0; ctx.globalAlpha = 1;
}
